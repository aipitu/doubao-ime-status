name: macOS CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and changelog
        run: python3 scripts/validate-version.py
      - name: Test state and geometry
        run: bash scripts/test-core.sh
      - name: Build universal app (ad-hoc)
        run: bash scripts/build-macos.sh
      - name: Verify artifacts and release tooling
        run: |
          python3 scripts/verify-artifact.py dist/DoubaoCaret.app
          python3 Tests/test-artifact.py
          python3 Tests/test-release.py
      - name: AppKit startup smoke test (no permission prompts)
        run: dist/DoubaoCaret.app/Contents/MacOS/DoubaoCaret --smoke-test
        timeout-minutes: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DoubaoCaret-ci-${{ github.sha }}
          path: dist/DoubaoCaret-macos-universal.zip
          if-no-files-found: error
          retention-days: 14
